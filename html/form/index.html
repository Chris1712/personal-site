<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96x96.png">
    <title>Test form | Christopher Turner</title>
    <style>
        form {
            display: grid;
            gap: 8px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
            padding: 10px;
            margin-bottom: 12px;
            font: inherit;
            border: 1px solid #767676;
            border-radius: 4px;
        }

        input[type="submit"] {
            cursor: pointer;
            background: #222;
            color: white;
        }

        #submitted {
            display: none;
        }

        #submitted:target {
            display: block;
        }
    </style>
</head>
<body>
<main class="container">
    <h1>Test form</h1>
    <p>A simple form for testing HubSpot submission capture. Please use test details.</p>
    <p id="submitted" role="status">Form submitted. Check HubSpot to confirm it was captured.</p>

    <!-- Native GET submission keeps this static page compatible with HubSpot's collector. -->
    <form id="hubspot-test-form" action="/form/#submitted" method="get">
        <label for="firstname">First name</label>
        <input id="firstname" name="firstname" type="text" autocomplete="given-name">

        <label for="lastname">Last name</label>
        <input id="lastname" name="lastname" type="text" autocomplete="family-name">

        <label for="email">Email (required)</label>
        <input id="email" name="email" type="email" autocomplete="email" required>

        <input type="submit" value="Submit">
    </form>
</main>

<script id="hs-script-loader" async defer src="https://js.hs-scriptsqa.com/911097283.js"></script>
</body>
</html>
